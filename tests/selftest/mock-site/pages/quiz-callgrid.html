  <script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"quiz":{"provider":"callgrid","callgridCampaignSourceId":"CG-SRC-777","cta":{"callCallgrid":true,"phone":"+18445550199"}}}},"page":"/quiz-callgrid"}</script>
  <script>
    var BAD = location.search.indexOf('bad=1') >= 0;
    window.QUIZ = {
      typingMs: 250,
      questions: [
        { key: 'coverage', q: 'Are you looking for coverage?', answers: ['Yes', 'No'] },
        { key: 'age_range', q: 'What is your age range?', answers: ['18-64', '65+'] },
      ],
      mutateQuizData: function (p) {
        if (p.question_key !== 'zip') return;
        // correct: collectedzipcode · broken: the Ringba key on a CallGrid site
        if (BAD) p.ringba_zip = p.answer_value; else p.collectedzipcode = p.answer_value;
      },
      onZip: function (zip) {
        var body = { callgridCampaignSourceId: 'CG-SRC-777' };
        if (BAD) { window._rgba_tags = window._rgba_tags || []; window._rgba_tags.push({ ringba_zip: zip }); body.ringba_zip = zip; }
        else body.collectedzipcode = zip;
        fetch('https://api.callgrid.test/v1/visitor', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        document.getElementById('done').hidden = false;
      },
    };
  </script>
  <script src="/quiz-engine.js"></script>
